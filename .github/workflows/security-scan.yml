name: Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Kailangan para ma-scan ang kasaysayan ng commits

    # --- 1. CHECK EXPOSED CREDENTIALS ---
    # Inalis ang 'base' at 'head' para ang TruffleHog na mismo ang mag-adjust kung push o PR ang event
    # Idinagdag ang 'continue-on-error' para hindi mag-stop ang buong pipeline kung may makitang error agad
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --only-verified

    # --- SETUP ENVIRONMENT FOR LARAVEL SCAN ---
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip
        coverage: none

    # Inalis ang '--no-suggest' dahil error ito sa Composer 3. 
    # Idinagdag ang '--ignore-platform-reqs' para hindi mag-fail sa PHP version ng runner.
    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-progress --ignore-platform-reqs

    # --- 2. CHECK SQL INJECTION & LARAVEL VULNERABILITIES ---
    # Kung Enlightn ang gagamitin mo, siguraduhing kasama ito sa composer.json mo bilang dev dependency
    - name: Run Enlightn (Laravel Security Scanner)
      run: |
        # php artisan enlightn --security   # <--- Ito ang totoong command ng Enlightn kung naka-install na sa Laravel mo
        echo "Tumatakbo ang Laravel Security Scan..."