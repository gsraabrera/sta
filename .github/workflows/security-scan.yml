name: Security Scan

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    # --- 1. CHECK EXPOSED CREDENTIALS ---
    # Ginawang false ang --only-verified para mahuli kahit dummy keys na ite-test mo
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        # extra_args: --only-verified=false

    # --- SETUP ENVIRONMENT FOR LARAVEL SCAN ---
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql
        coverage: none

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-progress --ignore-platform-reqs

# --- 2. CHECK LARAVEL DEPENDENCY VULNERABILITIES (COMPOSER AUDIT) ---
    # Ito ang pinakabagong standard ngayon sa modernong Laravel.
    # Iiskanin nito ang iyong composer.lock laban sa opisyal na GitHub Advisory Database.
    # Kung may kilalang vulnerability o leak ang mga gamit mong pakete, haharangin niya ito.
    - name: Run Composer Audit (Security Checker)
      run: composer audit

# Itinaas natin ang level sa 9 (Pinakamataas at Pinakamahigpit) 
    # para masuri ang bawat string concatenation sa loob ng DB queries.
    - name: Run Larastan (Strict Security Analysis)
      run: |
        composer require nunomaduro/larastan --dev --ignore-platform-reqs -W
        
        # Gagawa tayo ng pansamantalang phpstan.neon file para pilitin ang strict checks
        echo "parameters:" > phpstan.neon
        echo "  level: 9" >> phpstan.neon
        echo "  paths:" >> phpstan.neon
        echo "    - routes" >> phpstan.neon
        echo "    - app"        >> phpstan.neon # Kasama lahat ng Controllers, Models, Services, at sub-folders nito
        echo "    - routes"     >> phpstan.neon # Kasama ang web.php, api.php, etc.
        echo "    - database"   >> phpstan.neon # Kasama ang mga Seeders at Migrations (baka may SQL injection din doon)
        echo "    - config"     >> phpstan.neon # Kasama lahat ng configuration files
        
        vendor/bin/phpstan analyse