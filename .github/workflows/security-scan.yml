name: Security Scan

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    # --- 1. CHECK EXPOSED CREDENTIALS ---
    # Ginawang false ang --only-verified para mahuli kahit dummy keys na ite-test mo
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        # extra_args: --only-verified=false

    # --- SETUP ENVIRONMENT FOR LARAVEL SCAN ---
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql
        coverage: none

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-progress --ignore-platform-reqs

    # --- 2. CHECK LARAVEL CONFIG VULNERABILITIES (ENLIGHTN) ---
    # Tinitingnan nito kung may leak sa .env o unsecured sessions
    - name: Run Enlightn Security Checker
      run: |
        composer require-dev enlightn/security-checker --ignore-platform-reqs
        vendor/bin/security-checker security:check composer.lock

    # --- 3. CHECK SQL INJECTION & UNSAFE CODE (LARASTAN) ---
    # ITO ANG MAKAKA-DETECT NG SQL INJECTION SA MGA CONTROLLERS MO.
    # Inalis ang "|| true" para kapag may nakitang SQL injection, MAG-FAIL (Pula) talaga ang GitHub Actions.
    - name: Run Larastan (Static Analysis)
      run: |
        composer require-dev nunomaduro/larastan --ignore-platform-reqs
        vendor/bin/phpstan analyse app/ --level=4