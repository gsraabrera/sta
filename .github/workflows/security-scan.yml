name: Security Scan

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
    # STEP 1: I-download ang code mula sa iyong GitHub repository
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    # STEP 2: I-scan ang BUONG REPO (Root at History) para sa mga nakalantad na passwords/keys
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./

    # STEP 3: I-ready ang PHP runner ng GitHub Actions
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql
        coverage: none

    # STEP 4: I-install ang mga dependencies para maunawaan ng scanner ang Laravel structure
    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-progress --ignore-platform-reqs

    # STEP 5: I-scan ang composer.lock para sa mga paketeng may kilalang kumakalat na virus/vulnerability
    - name: Run Composer Audit (Security Checker)
      run: composer audit

    # STEP 6: Patakbuhin ang malupit na SQL Injection check sa mga custom folders niyo (Level 9)
    - name: Run Larastan (Strict Security Analysis)
      run: |
        composer require nunomaduro/larastan --dev --ignore-platform-reqs -W
        
        # Gumawa ng malinis na configuration file nang walang dobleng linya at walang config folder
        echo "parameters:" > phpstan.neon
        echo "  level: 9" >> phpstan.neon
        echo "  paths:" >> phpstan.neon
        echo "    - app"        >> phpstan.neon
        echo "    - routes"     >> phpstan.neon
        echo "    - database"   >> phpstan.neon
        
        vendor/bin/phpstan analyse --configuration=phpstan.neon