name: Security Scan

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    # --- 1. CHECK EXPOSED CREDENTIALS ---
    # Ginawang false ang --only-verified para mahuli kahit dummy keys na ite-test mo
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        # extra_args: --only-verified=false

    # --- SETUP ENVIRONMENT FOR LARAVEL SCAN ---
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql
        coverage: none

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-progress --ignore-platform-reqs

# --- 2. CHECK LARAVEL CONFIG VULNERABILITIES (ENLIGHTN) ---
    - name: Run Enlightn Security Checker
      run: |
        # Inayos mula sa 'require-dev' tungo sa 'require --dev'
        composer require enlightn/security-checker --dev --ignore-platform-reqs
        vendor/bin/security-checker security:check composer.lock

    # --- 3. CHECK SQL INJECTION & UNSAFE CODE (LARASTAN) ---
    - name: Run Larastan (Static Analysis)
      run: |
        # Inayos din dito para tama ang syntax ng Composer
        composer require nunomaduro/larastan --dev --ignore-platform-reqs
        vendor/bin/phpstan analyse app/ --level=4